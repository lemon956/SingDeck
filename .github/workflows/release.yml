name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Android release version
        id: android-version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Release tag must use vMAJOR.MINOR.PATCH, for example v0.3.7"
            exit 1
          fi

          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          if (( minor >= 1000 || patch >= 1000 )); then
            echo "::error::Android versionCode encoding requires minor and patch to be below 1000"
            exit 1
          fi

          version_code=$((major * 1000000 + minor * 1000 + patch))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "::error::Computed Android versionCode is outside the supported range: $version_code"
            exit 1
          fi

          echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Validate Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          missing=()
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -n "$ANDROID_KEY_ALIAS" ]] || missing+=(ANDROID_KEY_ALIAS)
          [[ -n "$ANDROID_KEY_PASSWORD" ]] || missing+=(ANDROID_KEY_PASSWORD)
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required Android signing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify frontend
        run: pnpm check

      - name: Restore libbox
        id: libbox-cache
        uses: actions/cache@v4
        with:
          path: android/app/libs/libbox.aar
          key: libbox-android-arm64-${{ hashFiles('scripts/build-android-libbox.sh', 'scripts/patches/sing-box-v1.14.0-libbox-inspector.patch', 'android/app/build.gradle') }}

      - name: Build pinned libbox
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        env:
          SINGDECK_ANDROID_CACHE_DIR: ${{ runner.temp }}/singdeck-android-build-cache
        run: SINGDECK_ANDROID_SDK_DIR="$ANDROID_HOME" scripts/build-android-libbox.sh

      - name: Verify Android app
        run: scripts/check-android.sh

      - name: Verify helper
        run: pnpm helper:test

      - name: Build helper
        run: cargo build --release --manifest-path helper/Cargo.toml

      - name: Build Android release APK
        run: |
          cd android
          ./gradlew --no-daemon :app:assembleRelease \
            -PsingdeckVersionName="${{ steps.android-version.outputs.name }}" \
            -PsingdeckVersionCode="${{ steps.android-version.outputs.code }}"

      - name: Decode Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/singdeck-release.jks"

      - name: Sign and verify Android release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          unsigned_apk="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned_apk="$RUNNER_TEMP/singdeck-release-aligned.apk"
          release_apk="release-artifacts/singdeck-android-arm64-${GITHUB_REF_NAME}.apk"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"

          [[ -f "$unsigned_apk" ]] || {
            echo "::error::Android release build did not produce $unsigned_apk"
            exit 1
          }
          mkdir -p release-artifacts
          "$build_tools/zipalign" -f -P 16 4 "$unsigned_apk" "$aligned_apk"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/singdeck-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --v4-signing-enabled false \
            --out "$release_apk" \
            "$aligned_apk"
          "$build_tools/zipalign" -c -P 16 4 "$release_apk"
          "$build_tools/apksigner" verify --verbose --print-certs "$release_apk"

      - name: Remove Android signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/singdeck-release.jks"

      - name: Package release assets
        run: |
          tag_name="${GITHUB_REF_NAME//\//-}"
          web_dir="singdeck-web-${tag_name}"
          mkdir -p release-artifacts
          mkdir -p "release-staging/${web_dir}"
          cp -R dist/. "release-staging/${web_dir}/"
          tar -czf "release-artifacts/${web_dir}.tar.gz" -C release-staging "${web_dir}"
          tar -czf "release-artifacts/singdeck-systemd-${tag_name}.tar.gz" -C deploy systemd
          cp helper/target/release/singdeck-helper "release-artifacts/singdeck-helper-linux-x86_64-${tag_name}"
          rm -rf release-staging
          (cd release-artifacts && sha256sum * > SHA256SUMS)

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-artifacts/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
